name: Sync MIBP

# Keeps the `sync-mibp` branch up to date with BOTH of its upstreams:
#   - mhiqrambg/9router-mibp-version (default branch: master)  [fork base]
#   - decolua/9router                (default branch: master)  [upstream features]
#
# `sync-mibp` is the UNION of the two repos: it carries every MIBP fork feature
# AND every decolua upstream feature. The fork base (mibp) is merged first and
# wins plain conflicts; decolua is merged second so its new features are additive.
# Fork-only features are then re-protected by the guards further down
# (workflow restore, preferredConnectionId guard, apply-custom-patches.mjs).
#
# What this workflow does, every hour:
#   1. Merge mibp/master into sync-mibp (fork base; -X ours on conflict).
#   2. Merge decolua/master into sync-mibp (upstream features; -X theirs on conflict).
#   2b. Re-protect fork-only files/workflows + re-apply custom patches.
#   3. Refresh npm dependencies inside their semver ranges (npm update) and commit the lockfile.
#   4. Trigger the Docker image build from sync-mibp if anything changed.
#
# NOTE: decolua/9router is ALSO tracked on `master`/`custom-patch` by
# sync-upstream.yml. That is intentional: `master` tracks decolua cleanly for
# reference, while `sync-mibp` is the combined deployment branch.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      skip_deps:
        description: Skip npm dependency refresh
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-mibp
  cancel-in-progress: false

env:
  # The fork base for the sync-mibp branch.
  MIBP_UPSTREAM: https://github.com/mhiqrambg/9router-mibp-version.git
  # The decolua upstream whose features are unioned into sync-mibp.
  DECOLUA_UPSTREAM: https://github.com/decolua/9router.git
  BRANCH: sync-mibp

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: sync-mibp
          # GH_PAT (not GITHUB_TOKEN) is required: upstream modifies files under
          # .github/workflows/, and GITHUB_TOKEN is forbidden from pushing those
          # ("refusing to allow a GitHub App to create or update workflow ...").
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync mibp + decolua upstreams -> sync-mibp
        id: sync
        env:
          INPUT_SKIP_DEPS: ${{ inputs.skip_deps }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add mibp "$MIBP_UPSTREAM" || git remote set-url mibp "$MIBP_UPSTREAM"
          git remote add decolua "$DECOLUA_UPSTREAM" || git remote set-url decolua "$DECOLUA_UPSTREAM"
          git fetch mibp master
          git fetch decolua master
          git fetch origin "$BRANCH" || true

          # 1) Bring the branch in line with the fork base, preferring the fork
          #    on plain conflicts so MIBP-only features are never silently lost.
          git checkout "$BRANCH"
          BEFORE_TREE=$(git rev-parse "HEAD^{tree}")

          if git merge-base --is-ancestor "mibp/master" HEAD; then
            echo "Already up to date with mibp/master."
            NEEDS_FORCE=false
          elif git merge --ff-only "mibp/master"; then
            echo "Fast-forwarded $BRANCH to mibp/master"
            NEEDS_FORCE=false
          elif git merge "mibp/master" --no-edit -X ours; then
            echo "Merged mibp/master into $BRANCH (ours on conflict)"
            NEEDS_FORCE=false
          else
            # Fork base rewrote history or has an intractable conflict: follow it.
            echo "Merge failed; resetting $BRANCH to mibp/master (history rewrite)"
            git merge --abort 2>/dev/null || true
            git reset --hard "mibp/master"
            NEEDS_FORCE=true
          fi

          # 1b) Union in the decolua upstream. -X theirs keeps decolua's new
          #     features on additive conflicts; fork-only features are restored
          #     by the guards below.
          if git merge-base --is-ancestor "decolua/master" HEAD; then
            echo "Already up to date with decolua/master."
          elif git merge --ff-only "decolua/master"; then
            echo "Fast-forwarded $BRANCH to decolua/master"
          elif git merge "decolua/master" --no-edit -X theirs; then
            echo "Merged decolua/master into $BRANCH (theirs on conflict)"
          else
            echo "::error::decolua/master merge failed with conflicts; leaving branch on mibp base only."
            git merge --abort 2>/dev/null || true
          fi

          # Abort if a merge ever introduces conflict markers.
          if git grep -n -E '^(<<<<<<<|>>>>>>>) ' -- .; then
            echo "Conflict markers found after merge; aborting."
            exit 1
          fi

          # 1c) Protect our own CI. Neither upstream carries these fork workflows,
          # so a merge would DELETE sync-mibp.yml and sync-upstream.yml, and
          # OVERWRITE docker-publish.yml with a variant that pushes to Docker Hub.
          # Restore the pre-merge versions from BEFORE_REF.
          git fetch origin "$BRANCH"
          BEFORE_REF=$(git rev-parse "origin/$BRANCH")
          for f in \
            .github/workflows/sync-mibp.yml \
            .github/workflows/sync-upstream.yml \
            .github/workflows/docker-publish.yml \
            .github/workflows/gitbook-pages.yml.disabled \
            .github/dependabot.yml
          do
            if git cat-file -e "$BEFORE_REF:$f" 2>/dev/null; then
              git checkout "$BEFORE_REF" -- "$f"
              echo "Restored $f from $BEFORE_REF"
            fi
          done

          # 1c) Guard the MIBP-only chat handler. Upstream deliberately dropped
          # `preferredConnectionId` from src/sse/handlers/chat.js, but this fork
          # needs it (Antigravity MITM pins an account via `x-connection-id`).
          # A naive merge produces the worst of both worlds: declaration removed,
          # usages kept -> every combo request throws
          #   ReferenceError: preferredConnectionId is not defined
          # Detect that exact state and restore our copy instead of shipping it.
          CHAT=src/sse/handlers/chat.js
          if git cat-file -e "$BEFORE_REF:$CHAT" 2>/dev/null; then
            USES=$(grep -c 'preferredConnectionId' "$CHAT" || true)
            DECLS=$(grep -cE '(const|let|var)[[:space:]]+preferredConnectionId' "$CHAT" || true)
            if [ "$USES" -gt 0 ] && [ "$DECLS" -eq 0 ]; then
              echo "::warning::$CHAT has orphan preferredConnectionId (uses=$USES decls=$DECLS); restoring our version."
              git checkout "$BEFORE_REF" -- "$CHAT"
            else
              echo "$CHAT OK (uses=$USES decls=$DECLS)"
            fi
          fi
          for f in tests/unit/preferredConnectionIdScope.test.js; do
            if git cat-file -e "$BEFORE_REF:$f" 2>/dev/null && [ ! -f "$f" ]; then
              git checkout "$BEFORE_REF" -- "$f"
              echo "Restored $f from $BEFORE_REF"
            fi
          done
          # If upstream deleted this file, drop the deletion so it stays on this branch.
          git diff --name-only --diff-filter=D HEAD | grep -E '^\.github/' || true

          # 1d) Re-apply the fork's durable custom patches. The decolua merge can
          # overwrite fork-branded files (provider page auto-test wiring, ModelRow
          # disable support, IzRouter branding). apply-custom-patches.mjs restores
          # them idempotently; it exits non-zero only if a required anchor is gone.
          if [ -f scripts/apply-custom-patches.mjs ] && [ -f package.json ]; then
            echo "::group::apply custom patches (fork features)"
            npm install --no-audit --no-fund --ignore-scripts >/dev/null 2>&1 || true
            node scripts/apply-custom-patches.mjs 2>&1 | tail -n 40
            echo "::endgroup::"
          else
            echo "apply-custom-patches.mjs or package.json missing; skipping."
          fi

          # 2) Refresh dependencies within their declared semver ranges.
          if [ "${INPUT_SKIP_DEPS:-false}" != "true" ] && [ -f package.json ]; then
            echo "::group::npm update (semver-safe)"
            npm update --no-audit --no-fund 2>&1 | tail -n 40 || \
              echo "npm update failed; continuing with upstream code only."
            echo "::endgroup::"
          else
            echo "Dependency refresh skipped."
          fi

          # 2b) Hard gate: a merge must never reintroduce an orphan
          # preferredConnectionId. Fail the job instead of pushing broken code.
          if [ -f "$CHAT" ]; then
            USES=$(grep -c 'preferredConnectionId' "$CHAT" || true)
            DECLS=$(grep -cE '(const|let|var)[[:space:]]+preferredConnectionId' "$CHAT" || true)
            if [ "$USES" -gt 0 ] && [ "$DECLS" -eq 0 ]; then
              echo "::error::$CHAT would throw 'preferredConnectionId is not defined' (uses=$USES decls=$DECLS). Refusing to push."
              exit 1
            fi
          fi
          node --check "$CHAT" 2>&1 || { echo "::error::$CHAT failed syntax check"; exit 1; }

          # 3) Commit only when the working tree actually changed.
          git add -A
          if git diff --cached --quiet; then
            echo "Working tree clean after sync."
          else
            git commit -m "chore(sync): merge mibp + decolua upstreams + refresh dependencies"
          fi

          # 4) Compare TREE hashes (content), not commit SHAs: a no-op merge
          #    commit must not trigger a rebuild.
          AFTER_TREE=$(git rev-parse "HEAD^{tree}")
          if [ "$BEFORE_TREE" = "$AFTER_TREE" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No content changes (tree $AFTER_TREE)"
          else
            if [ "$NEEDS_FORCE" = "true" ]; then
              git push --force-with-lease origin "$BRANCH"
            else
              git push origin "$BRANCH"
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Pushed $BRANCH (tree $BEFORE_TREE -> $AFTER_TREE)"
          fi

  # Self-contained GHCR-only build. We deliberately do NOT reuse
  # docker-publish.yml: upstream (mhiqrambg) removed its `workflow_call` trigger
  # and that workflow now pushes to Docker Hub, which needs DOCKERHUB_* secrets
  # we do not maintain on this fork.
  build-and-push:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync-mibp

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: log in to Docker Hub when credentials exist. Anonymous
      # docker.io pulls are limited to 100/6h per IP and the shared GitHub
      # runner IP pool regularly returns "429 Too Many Requests" when fetching
      # the pinned `node:22-alpine` base image. Authenticating raises the limit
      # to 200/6h and is the most reliable fix. Skipped gracefully when the
      # secrets are not configured (fork-friendly).
      - name: Log in to Docker Hub (optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Pre-pull the pinned base image with retries/backoff. Docker Hub 429s are
      # usually transient; retrying here avoids a failed buildx step. Pulling the
      # exact digest first also warms the local store so buildx reuses it.
      - name: Pre-pull base image (retry on rate limit)
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ vars.NODE_BASE_IMAGE || 'node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32' }}"
          for attempt in 1 2 3 4 5; do
            echo "docker pull attempt ${attempt}: ${BASE_IMAGE}"
            if docker pull "${BASE_IMAGE}"; then
              echo "Base image pulled successfully."
              exit 0
            fi
            echo "Pull failed (attempt ${attempt}); backing off $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pull ${BASE_IMAGE} after 5 attempts (likely Docker Hub rate limit)."
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
