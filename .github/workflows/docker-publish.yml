name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: custom-patch
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: custom-patch

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v4

      # Guard: the committed package-lock.json must be npm-10-compatible (the
      # Docker image ships npm 10.9.8). Fails fast with a fix hint instead of a
      # cryptic `npm ci` EUSAGE error. See AGENTS.md §1.
      - name: Verify lockfile is npm-10-compatible
        run: node scripts/verify-lockfile-npm10.mjs

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional Docker Hub login: anonymous pulls of the pinned `node:22-alpine`
      # base image hit the 100/6h per-IP limit on shared runner IPs ("429 Too
      # Many Requests"). Authenticating raises it to 200/6h. Skipped when the
      # secrets are absent so forks keep working.
      - name: Log in to Docker Hub (optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Pre-pull the pinned base image with retries/backoff to ride out
      # transient Docker Hub rate limiting before buildx runs.
      - name: Pre-pull base image (retry on rate limit)
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ vars.NODE_BASE_IMAGE || 'node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32' }}"
          for attempt in 1 2 3 4 5; do
            echo "docker pull attempt ${attempt}: ${BASE_IMAGE}"
            if docker pull "${BASE_IMAGE}"; then
              echo "Base image pulled successfully."
              exit 0
            fi
            echo "Pull failed (attempt ${attempt}); backing off $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pull ${BASE_IMAGE} after 5 attempts (likely Docker Hub rate limit)."
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
